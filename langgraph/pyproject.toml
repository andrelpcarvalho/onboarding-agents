[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-agents-langgraph"
version = "0.1.0"
description = "Onboarding multiagente (Tutor + Curador) em LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langchain-core>=1.6",
  "langchain-google-genai>=4.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
studio = ["langgraph-cli[inmem]>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
