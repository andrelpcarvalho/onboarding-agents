[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-curator"
version = "0.1.0"
description = "Curador isolado: PDF → base de conhecimento, trilha e materiais com quiz (rascunhos)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-adk[a2a]>=2.11",
  "pypdf>=6.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
