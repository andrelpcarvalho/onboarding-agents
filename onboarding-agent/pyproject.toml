[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Multi-agent onboarding (Tutor + Curador) com Google ADK"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-adk[db]>=2.11",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  # guardrail de PII; requer também: python -m spacy download pt_core_news_sm (make setup faz)
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]

[project.optional-dependencies]
# Habilita LiteLlm (Claude, OpenAI, etc.) via MODEL=provider/model no .env
litellm = ["google-adk[extensions]>=2.11"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "google-adk[eval]>=2.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
