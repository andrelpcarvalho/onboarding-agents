[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Multi-agent onboarding (Tutor + Curador) com Google ADK"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Versões FIXAS: as que passaram em `make eval-stable` (3/3 e 13/13, 28/10/2026).
# O ADK muda rápido (2.11 -> 2.13 em semanas; LoopAgent/SequentialAgent já deprecados).
# Para atualizar: suba a versão, rode `make test && make eval-stable` e só então faça o PR.
dependencies = [
  "google-adk[db]==2.13.0",
  "aiosqlite==0.22.1",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  # guardrail de PII; requer também: python -m spacy download pt_core_news_sm (make setup faz)
  "presidio-analyzer==2.2.366",
  "presidio-anonymizer==2.2.366",
]

[project.optional-dependencies]
# Habilita LiteLlm (Claude, OpenAI, etc.) via MODEL=provider/model no .env
litellm = ["google-adk[extensions]==2.13.0"]
# Servidor MCP da base (make kb-mcp). A busca vetorial usa só o google-genai, já instalado.
mcp = ["mcp==2.3.0"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3", "google-adk[eval]==2.13.0", "mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
