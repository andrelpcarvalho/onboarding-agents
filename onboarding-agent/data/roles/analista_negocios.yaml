id: analista_negocios
title: Analista de Negócios
description: Levantamento de requisitos, histórias de usuário e homologação com as áreas.
buddy_contact: "#onboarding-negocios no Slack"
missions:
  - site_solar_proposta_acom
modules:
  - id: cultura_empresa
    title: Cultura e forma de trabalhar
    objectives:
      - Entender os valores da empresa e como eles aparecem no dia a dia
      - Conhecer os rituais do time (daily, review, retro)
    kb_tags: [cultura, valores, rituais]
    estimated_minutes: 20

  - id: acessos_ferramentas
    title: Acessos e ferramentas
    objectives:
      - Saber quais acessos solicitar no primeiro dia e por qual canal
    kb_tags: [acessos, ferramentas]
    estimated_minutes: 20

  - id: seguranca_informacao
    title: Segurança da informação
    objectives:
      - Conhecer as regras de manuseio de dados de clientes
      - Saber como reportar um incidente
    kb_tags: [seguranca, lgpd, incidente]
    estimated_minutes: 20

  - id: homologacao_gmud
    title: Homologação e GMUD
    objectives:
      - Entender o papel do analista na homologação em UAT
      - Saber o que é a GMUD e qual a responsabilidade do analista nela
    kb_tags: [uat, homologacao, gmud]
    prerequisites: [acessos_ferramentas]
    estimated_minutes: 30
